[tasks.build]
run = "cargo component build --workspace && pnpm install --frozen-lockfile && pnpm build"

[tasks.build-web]
description = 'Build the web-demo static site into packages/web-demo/dist'
run = [
  # cargo-component/wasm-tools are not mise tools: the devcontainer binstalls
  # them, a bare CI runner has to do it here.
  'command -v cargo-component >/dev/null || cargo binstall -y cargo-component wasm-tools',
  'pnpm install --frozen-lockfile',
  'pnpm --filter @wast/web-demo build',
]

[tasks.bundle-components]
run = "cd packages/vscode-extension && pnpm bundle-components"

[tasks.test-component]
depends = ['build']
run = "cargo test --workspace"

[tasks.test-ts]
depends = ['build']
run = "pnpm test"

[tasks.ci] # only dependencies to be run
description = 'Run CI tasks'
depends = ['build', 'test-component', 'test-ts']

[tools]
# rustc itself is pinned by rust-toolchain.toml at the repo root.
rust = "latest"
cargo-binstall = { version = "latest", depends = ["rust"] }
node = "24"
pnpm = "10"
wasmtime = "latest"
