name: Deploy web-demo to Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "packages/web-demo/**"
      - "mise.toml"
      - ".github/workflows/deploy-pages.yml"
  pull_request:
    # GitHub Actions' YAML parser has no anchors/aliases, so this list is a copy.
    paths:
      - "crates/**"
      - "packages/web-demo/**"
      - "mise.toml"
      - ".github/workflows/deploy-pages.yml"

# A reusable workflow runs with the CALLER's token permissions, so these have to
# be granted here — the callee's own permissions block can only narrow them.
permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

jobs:
  pages:
    # Builds main at the Pages root and, on a PR, the PR branch under
    # /<last-segment-of-branch-name>/, deploys both, and comments the preview
    # URL on the PR. Concurrency (group: pages) is defined by the callee.
    uses: kuboon/workflows/.github/workflows/github-page-with-preview.yaml@main
    with:
      # Bare ubuntu runner, not the devcontainer image, so mise has to be
      # trusted and its tools installed first. Everything past that lives in
      # the build-web task.
      build-command: mise trust && mise install && mise run build-web
      dist-dir: packages/web-demo/dist
