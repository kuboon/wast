name: Publish wasm components

# Publishes WASM components to GHCR as OCI artifacts with `wkg`
# (wasm-pkg-tools). Pull one with the same namespace config as below:
#   wkg get wast:compiler@<version>
#
# To publish another component, add an entry to the matrix: `package` is the
# cargo package that builds it, `wasm` the file name cargo-component emits
# (the package name with `-` replaced by `_`).

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - package: wast-compiler-component
          wasm: wast_compiler_component.wasm
    env:
      HOME: /root
      GITHUB_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/kuboon/wast/wast-dev-container:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    steps:
    - uses: actions/checkout@v6
    - name: Build component
      run: mise x -- cargo component build --release -p ${{ matrix.package }}
    - name: Install wkg
      run: mise x -- cargo binstall -y wkg
    - name: Configure wkg for GHCR
      env:
        GHCR_USER: ${{ github.actor }}
        GHCR_TOKEN: ${{ github.token }}
      run: |
        mkdir -p "$HOME/.config/wasm-pkg"
        cat > "$HOME/.config/wasm-pkg/config.toml" <<EOF
        [namespace_registries]
        wast = { registry = "ghcr.io", metadata = { preferredProtocol = "oci", oci = { registry = "ghcr.io", namespacePrefix = "kuboon/wast/" } } }

        [registry."ghcr.io".oci]
        auth = { username = "${GHCR_USER}", password = "${GHCR_TOKEN}" }
        EOF
    - name: Publish
      run: |
        mise x -- wkg publish \
          target/wasm32-wasip1/release/${{ matrix.wasm }}
