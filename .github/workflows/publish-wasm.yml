name: Publish wasm components

# Publishes WASM components to GHCR as OCI artifacts with
# `cargo component publish`. Pull one with the same namespace config as below:
#   wkg get wast:compiler@<version>
#
# `wkg publish` can't be used here: it reads the package name and version from
# the built wasm, which carries none (cargo-component encodes it as
# `root:component`), and wkg 0.16 still fails on that even with `--package`.
# `cargo component publish` takes the name from the crate's
# `[package.metadata.component] package` and the version from its `version`.
#
# To publish another component, add its cargo package to the matrix.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - package: wast-compiler-component
    env:
      HOME: /root
      GITHUB_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/kuboon/wast/wast-dev-container:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    steps:
    - uses: actions/checkout@v6
    - name: Configure wasm-pkg for GHCR
      env:
        GHCR_USER: ${{ github.actor }}
        GHCR_TOKEN: ${{ github.token }}
      run: |
        mkdir -p "$HOME/.config/wasm-pkg"
        cat > "$HOME/.config/wasm-pkg/config.toml" <<EOF
        [namespace_registries]
        wast = { registry = "ghcr.io", metadata = { preferredProtocol = "oci", oci = { registry = "ghcr.io", namespacePrefix = "kuboon/wast/" } } }

        [registry."ghcr.io".oci]
        auth = { username = "${GHCR_USER}", password = "${GHCR_TOKEN}" }
        EOF
    - name: Publish
      run: mise x -- cargo component publish -p ${{ matrix.package }}
